name: Manual Deploy (Supabase + SWA)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment name to use (must exist in repo settings)"
        type: string
        required: true

concurrency:
  group: manual-deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Preflight: validate required secrets/vars"
        run: |
          set -euo pipefail
          : "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          : "${{ vars.SUPABASE_PROJECT_REF }}"
          : "${{ secrets.AZURE_SWA_TOKEN }}"
          : "${{ vars.VITE_SUPABASE_URL }}"
          : "${{ vars.VITE_SUPABASE_ANON_KEY }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push DB migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check for Supabase functions
        id: check_funcs
        shell: bash
        run: |
          if [ -d supabase/functions ] && find supabase/functions -type f -not -name 'README*' -print -quit >/dev/null 2>&1; then
            echo "has_functions=true" >> $GITHUB_OUTPUT
          else
            echo "has_functions=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Edge Functions
        if: steps.check_funcs.outputs.has_functions == 'true'
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove local .env files to avoid accidental leakage
        run: rm -f .env .env.local .env.* || true

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
