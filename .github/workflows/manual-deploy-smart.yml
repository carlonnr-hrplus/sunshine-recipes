name: Manual Deploy Smart (Supabase + SWA)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment name to use (must exist in repo settings)"
        type: string
        required: true
      force_all_functions:
        description: "Force deploy ALL functions (ignore cache)"
        type: boolean
        required: false
        default: false

concurrency:
  group: manual-deploy-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Preflight: validate required secrets/vars"
        run: |
          set -euo pipefail
          : "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          : "${{ vars.SUPABASE_PROJECT_REF }}"
          : "${{ secrets.AZURE_SWA_TOKEN }}"
          : "${{ vars.VITE_SUPABASE_URL }}"
          : "${{ vars.VITE_SUPABASE_ANON_KEY }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project and push DB migrations
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── Smart function deployment ──────────────────────────────────────────
      #
      # Strategy: hash each function folder, compare against a per-environment
      # cache snapshot, then:
      #   - deploy functions that are new or modified
      #   - delete functions that existed in the snapshot but are gone from repo
      #   - skip functions whose hash is unchanged
      #
      # Cache key includes a run_id suffix so each successful deploy saves a
      # fresh key. The restore-keys prefix matches the most recent prior save.
      # On cache miss (first deploy, or 7-day eviction) all functions deploy.
      # ──────────────────────────────────────────────────────────────────────

      - name: Restore function hashes cache
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/fn-hashes-prev.json
          key: fn-hashes-${{ inputs.environment }}-${{ github.run_id }}
          restore-keys: |
            fn-hashes-${{ inputs.environment }}-

      - name: Compute current function hashes
        id: compute_hashes
        shell: bash
        run: |
          set -euo pipefail

          FUNCS_DIR="supabase/functions"
          OUT="/tmp/fn-hashes-current.json"
          echo "{}" > "$OUT"

          if [ ! -d "$FUNCS_DIR" ]; then
            echo "No functions directory found, skipping."
            echo "has_functions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_functions=true" >> "$GITHUB_OUTPUT"

          # Build a JSON object: { "fn-name": "sha256hash", ... }
          python3 - <<'PY'
          import os, hashlib, json

          funcs_dir = "supabase/functions"
          result = {}

          for fn_name in sorted(os.listdir(funcs_dir)):
              fn_path = os.path.join(funcs_dir, fn_name)
              if not os.path.isdir(fn_path):
                  continue
              h = hashlib.sha256()
              for root, dirs, files in os.walk(fn_path):
                  dirs.sort()
                  for fname in sorted(files):
                      fpath = os.path.join(root, fname)
                      rel = os.path.relpath(fpath, fn_path)
                      h.update(rel.encode())
                      with open(fpath, "rb") as f:
                          h.update(f.read())
              result[fn_name] = h.hexdigest()

          with open("/tmp/fn-hashes-current.json", "w") as f:
              json.dump(result, f, indent=2)

          print(f"Hashed {len(result)} function(s).")
          PY

      - name: Diff hashes and deploy changed functions
        if: steps.compute_hashes.outputs.has_functions == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FORCE_ALL: ${{ inputs.force_all_functions }}
        run: |
          set -euo pipefail

          PREV="/tmp/fn-hashes-prev.json"
          CURR="/tmp/fn-hashes-current.json"

          # If no prior cache or force flag, treat previous as empty
          if [ "$FORCE_ALL" = "true" ] || [ ! -f "$PREV" ]; then
            echo "{}" > "$PREV"
            echo "Cache miss or force flag — will deploy all functions."
          fi

          python3 - <<'PY'
          import json, subprocess, sys, os

          with open("/tmp/fn-hashes-prev.json") as f:
              prev = json.load(f)
          with open("/tmp/fn-hashes-current.json") as f:
              curr = json.load(f)

          to_deploy = [name for name, h in curr.items() if prev.get(name) != h]
          to_delete = [name for name in prev if name not in curr]

          print(f"Functions to deploy ({len(to_deploy)}): {to_deploy or 'none'}")
          print(f"Functions to delete ({len(to_delete)}): {to_delete or 'none'}")

          failed = []
          delete_failed = []

          for name in to_deploy:
              print(f"\n→ Deploying: {name}")
              r = subprocess.run(
                  ["supabase", "functions", "deploy", name],
                  capture_output=False,
              )
              if r.returncode != 0:
                  failed.append(name)

          for name in to_delete:
              print(f"\n→ Deleting removed function: {name}")
              r = subprocess.run(
                  ["supabase", "functions", "delete", name],
                  capture_output=True,
                  text=True,
              )
              combined = (r.stdout + r.stderr).lower()
              if r.returncode == 0 or "not found" in combined or "does not exist" in combined:
                  print(f"  Deleted (or already gone): {name}")
              else:
                  print(r.stdout, end="")
                  print(r.stderr, end="")
                  print(f"  Warning: failed to delete {name} — will retry on next deploy.")
                  delete_failed.append(name)

          # Re-inject only genuinely failed deletes so next deploy retries them.
          # Functions that were already gone are not re-queued.
          if delete_failed:
              with open("/tmp/fn-hashes-current.json") as f:
                  current = json.load(f)
              for name in delete_failed:
                  current[name] = prev[name]
              with open("/tmp/fn-hashes-current.json", "w") as f:
                  json.dump(current, f, indent=2)
              print(f"  Re-queued for next deploy: {delete_failed}")

          if failed:
              print(f"\nFailed to deploy: {failed}", file=sys.stderr)
              sys.exit(1)

          print("\nDone.")
          PY

      - name: Promote current hashes to cache file
        if: steps.compute_hashes.outputs.has_functions == 'true'
        shell: bash
        run: cp /tmp/fn-hashes-current.json /tmp/fn-hashes-prev.json

      - name: Save updated function hashes to cache
        if: steps.compute_hashes.outputs.has_functions == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/fn-hashes-prev.json
          key: fn-hashes-${{ inputs.environment }}-${{ github.run_id }}

      # ── Frontend ──────────────────────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove local .env files to avoid accidental leakage
        run: rm -f .env .env.local .env.* || true

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
